{% extends "base.html" %}
{% block page %}error{% endblock %}
{% block content %}
<section class="panel hero">
  <h1 class="glow-title">ERROR {{ code }}</h1>
  <p class="lead">{{ t('error_' ~ code) if code in (403, 404, 405, 413, 429) else t('error_404') }}</p>
  <a class="btn primary block" href="{{ url_for('index') }}">{{ t('error_back') }}</a>
</section>
{% endblock %}
